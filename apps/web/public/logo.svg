<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <radialGradient id="gl" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>
    <style>
      .pulse { animation: rp 2.4s ease-in-out infinite; transform-origin: 20px 20px; }
      .pulse-center { animation: rc 2s ease-in-out infinite; transform-origin: 20px 20px; }
      .spin { animation: sp 30s linear infinite; transform-origin: 20px 20px; }
      @keyframes rp { 0%,100% { opacity: 0.6; transform: scale(1); } 50% { opacity: 1; transform: scale(1.15); } }
      @keyframes rc { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }
      @keyframes sp { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      .n1 { animation-delay: 0s; }
      .n2 { animation-delay: 0.3s; }
      .n3 { animation-delay: 0.6s; }
      .n4 { animation-delay: 0.9s; }
      .n5 { animation-delay: 1.2s; }
      .n6 { animation-delay: 1.5s; }
      @media (prefers-reduced-motion: reduce) {
        .pulse, .pulse-center, .spin { animation: none !important; }
      }
    </style>
  </defs>
  <rect width="40" height="40" rx="9" fill="#0B0E14" />
  <g class="spin">
    <circle cx="20" cy="20" r="14" stroke="url(#g)" stroke-width="0.9" stroke-dasharray="2 3" opacity="0.55" fill="none" />
  </g>
  <line x1="20" y1="20" x2="20" y2="6" stroke="url(#g)" stroke-width="0.75" opacity="0.6" />
  <line x1="20" y1="20" x2="32.124" y2="13" stroke="url(#g)" stroke-width="0.75" opacity="0.6" />
  <line x1="20" y1="20" x2="32.124" y2="27" stroke="url(#g)" stroke-width="0.75" opacity="0.6" />
  <line x1="20" y1="20" x2="20" y2="34" stroke="url(#g)" stroke-width="0.75" opacity="0.6" />
  <line x1="20" y1="20" x2="7.876" y2="27" stroke="url(#g)" stroke-width="0.75" opacity="0.6" />
  <line x1="20" y1="20" x2="7.876" y2="13" stroke="url(#g)" stroke-width="0.75" opacity="0.6" />
  <circle class="pulse n1" cx="20" cy="6" r="2.3" fill="url(#g)" />
  <circle class="pulse n2" cx="32.124" cy="13" r="2.3" fill="url(#g)" />
  <circle class="pulse n3" cx="32.124" cy="27" r="2.3" fill="url(#g)" />
  <circle class="pulse n4" cx="20" cy="34" r="2.3" fill="url(#g)" />
  <circle class="pulse n5" cx="7.876" cy="27" r="2.3" fill="url(#g)" />
  <circle class="pulse n6" cx="7.876" cy="13" r="2.3" fill="url(#g)" />
  <circle cx="20" cy="20" r="9" fill="url(#gl)" opacity="0.75" />
  <circle class="pulse-center" cx="20" cy="20" r="4" fill="url(#g)" />
  <circle cx="20" cy="20" r="1.4" fill="#0B0E14" />
</svg>
