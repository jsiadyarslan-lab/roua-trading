<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mobile Dashboard Preview</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #05070b;
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }

      .wrap {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        padding: 8px;
        box-sizing: border-box;
      }

      .frame-shell {
        width: 390px;
        height: 580px;
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: #0b0f14;
      }

      iframe {
        display: block;
        width: 390px;
        height: 580px;
        border: 0;
        background: #0b0f14;
      }

      .label {
        position: absolute;
        top: 8px;
        left: 8px;
        color: #93a4b7;
        font-size: 12px;
        letter-spacing: 0.04em;
        opacity: 0.9;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="frame-shell">
        <iframe src="http://localhost:3000/dashboard" title="Dashboard mobile preview"></iframe>
      </div>
    </div>
  </body>
</html>
