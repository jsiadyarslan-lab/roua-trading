name: RouaTrading
options:
  bundleIdPrefix: com.roua
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "${APPLE_TEAM_ID}"
    CODE_SIGN_STYLE: Automatic

targets:
  RouaTrading:
    type: application
    platform: iOS
    sources:
      - path: RouaTrading/Sources
        excludes:
          - "**/.DS_Store"
    resources:
      - path: RouaTrading/Sources/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roua.trading
        INFOPLIST_FILE: RouaTrading/Sources/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: RouaTrading/Sources/Resources/RouaTrading.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
        SWIFT_EMIT_LOC_STRINGS: true
        GENERATE_INFOPLIST_FILE: false
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_STRICT_CONCURRENCY: minimal
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
          CODE_SIGNING_REQUIRED: true
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          CODE_SIGN_IDENTITY: "Apple Distribution"
          CODE_SIGNING_REQUIRED: true
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    dependencies:
      - package: KeychainAccess
        product: KeychainAccess

packages:
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess
    from: "4.2.2"
