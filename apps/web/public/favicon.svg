<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background circle (dark) -->
  <circle cx="16" cy="16" r="16" fill="#020308"/>
  <!-- Outer ring glow -->
  <circle cx="16" cy="16" r="14.5" fill="none" stroke="rgba(0,200,255,0.3)" stroke-width="1.5"/>
  <!-- Globe icon (simplified Globe2 from lucide) -->
  <g transform="translate(16,16)" fill="none" stroke="#00D4FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer circle -->
    <circle r="9"/>
    <!-- Ellipse (equator) -->
    <ellipse rx="4" ry="9"/>
    <!-- Horizontal line -->
    <line x1="-9" y1="0" x2="9" y2="0"/>
    <!-- Top arc -->
    <path d="M-8,-4 Q0,-5 8,-4" fill="none"/>
    <!-- Bottom arc -->
    <path d="M-8,4 Q0,5 8,4" fill="none"/>
  </g>
</svg>
