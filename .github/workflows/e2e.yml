# Roua Trading — E2E Tests with Playwright
#
# Runs PWA installability tests, offline behavior tests, and responsive
# design tests against the production build.
#
# Tests run on:
#   - PRs that touch apps/web/**
#   - Pushes to main that touch apps/web/**
#
# Browser matrix:
#   - Desktop Chrome (1280x800)
#   - Mobile Chrome (Pixel 9 — for PWA + touch tests)
#   - Mobile Safari (iPhone 16 — for iOS behavior)

name: E2E Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'tests/**'
      - 'playwright.config.ts'
      - '.github/workflows/e2e.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'tests/**'
      - 'playwright.config.ts'
      - '.github/workflows/e2e.yml'

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Build web app
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: bun run build

      - name: Start production server
        working-directory: apps/web
        env:
          PORT: '3000'
          NODE_ENV: 'production'
        run: |
          bun run start &
          for i in {1..30}; do
            if curl -sf http://localhost:3000/ar > /dev/null 2>&1; then
              echo "Server is ready"
              break
            fi
            sleep 1
          done

      - name: Run Playwright tests
        env:
          CI: 'true'
          E2E_BASE_URL: 'http://localhost:3000'
        run: npx playwright test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

      - name: Stop server
        if: always()
        run: pkill -f "next start" || true
