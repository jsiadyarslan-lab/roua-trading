# Roua Trading — Chart Bug Prevention Pipeline
#
# This workflow runs on every PR that touches any code.
# It does THREE things:
#   1. check-registry.ts — FAILS if code changed but BUGS.md was NOT updated
#   2. verify-bugs.ts — FAILS if any FIXED bug has REGRESSED
#   3. run-regression-tests.ts — FAILS if any regression test fails
#
# A PR is BLOCKED if:
#   - Code files (.ts/.tsx) changed but BUGS.md was not updated (CONTRIBUTING.md rule)
#   - Any bug marked FIXED in BUGS.md has REGRESSED (OPEN pattern matches again)
#   - Any regression test fails
#
# A PR is NOT blocked by:
#   - OPEN bugs (known issues being worked on)
#   - UNKNOWN bugs (stale patterns — these need a BUGS.md update, not a code fix)

name: Chart Bug Prevention

on:
  pull_request:
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - 'BUGS.md'
      - 'scripts/**'
  push:
    branches: [main]
    paths:
      - 'apps/web/src/lib/charts/**'
      - 'apps/web/src/components/charts/**'
      - 'BUGS.md'

jobs:
  check-registry:
    name: Check BUGS.md was updated
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check if code changes are accompanied by BUGS.md updates
        run: npx tsx scripts/check-registry.ts --base origin/${{ github.base_ref }} --head HEAD

  verify-bugs:
    name: Verify Bug Registry (catch regressions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run verify-bugs.ts
        run: npx tsx scripts/verify-bugs.ts

  regression-tests:
    name: Run Regression Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run all BUG-NNN.spec.ts tests
        run: npx tsx scripts/run-regression-tests.ts
